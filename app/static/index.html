<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adhan</title><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0b1110" id="tc">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Adhan">
<script>if(localStorage.theme==="light")document.documentElement.classList.add("light")</script>
<style>
:root{--bg:#0b1110;--bg2:#0f1816;--card:#141e1b;--card2:#1a2622;--fg:#e8f0ec;--muted:#93a69d;--line:#24332e;--accent:#34d399;--accent2:#10b981;--onaccent:#04241a;--glow:rgba(52,211,153,.18);--danger:#f87171;--warn:#fbbf24;--shadow:0 10px 30px rgba(0,0,0,.35);--r:18px}
:root.light{--bg:#eef3f1;--bg2:#e6edea;--card:#ffffff;--card2:#f5f8f7;--fg:#13201b;--muted:#5c6b65;--line:#dde5e1;--accent:#059669;--accent2:#047857;--onaccent:#fff;--glow:rgba(5,150,105,.12);--danger:#dc2626;--warn:#b45309;--shadow:0 8px 24px rgba(16,40,30,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,var(--glow),transparent),var(--bg);color:var(--fg);line-height:1.45;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);font-size:20px;box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}.sub{color:var(--muted);font-size:.82rem}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1.1fr .9fr}.span2{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:.95rem;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.card h2 .tag{margin-left:auto}
.hero{display:flex;gap:20px;align-items:center;background:linear-gradient(140deg,var(--card2),var(--card));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:var(--glow);filter:blur(10px)}
.ring{position:relative;width:150px;height:150px;flex:none}.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .cd{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .lbl{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}
.hero .name{font-size:2.3rem;font-weight:750;letter-spacing:-.03em;line-height:1.1;color:var(--accent)}.hero .at{font-size:1.1rem;margin-top:2px}
@media(max-width:520px){.hero{flex-direction:column;text-align:center}.hero .name{font-size:2rem}}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid transparent;transition:border-color .2s,transform .2s,background .2s}
.prow:hover{border-color:var(--line);transform:translateY(-1px)}
.prow.next{border-color:var(--accent);background:linear-gradient(90deg,var(--glow),var(--card2));box-shadow:0 0 0 3px var(--glow)}
.prow .pn{font-weight:650}.prow .pt{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem}
.prow.sun{opacity:.7;grid-template-columns:1fr auto}
.prow.off .pn,.prow.off .pt{opacity:.45}
.opts{grid-column:1/-1;display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
@media(max-width:520px){.opts{grid-template-columns:1fr 1fr}.opts select{grid-column:1/-1}}
.sw{position:relative;width:44px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span::before{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;font-size:.88rem;border:1px solid transparent;border-radius:12px;padding:9px 14px;cursor:pointer;background:var(--accent);color:var(--onaccent);transition:transform .15s,filter .15s,background .2s;display:inline-flex;align-items:center;gap:6px}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:none}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}button.ghost:hover{background:var(--card2)}
button.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
button.sm{padding:6px 10px;font-size:.8rem;border-radius:10px}
input,select{font:inherit;font-size:.9rem;width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:500}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:.82rem}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card2);margin-bottom:8px;flex-wrap:wrap}
.item .meta{flex:1;min-width:140px;overflow:hidden}.item .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--glow);color:var(--accent)}
.tag.link{background:color-mix(in srgb,#60a5fa 18%,transparent);color:#60a5fa}:root.light .tag.link{color:#1d4ed8}
.warn{color:var(--warn);font-size:.8rem}
audio{height:34px;max-width:220px;width:100%}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--card2);padding:4px;border-radius:12px;width:max-content}
.tabs button{background:transparent;color:var(--muted);padding:7px 12px}.tabs button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;transition:border-color .2s}.drop:hover{border-color:var(--accent)}
#log{max-height:280px;overflow:auto;font-size:.8rem}#log div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
#log .t{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}#log .error{color:var(--danger)}#log .play{color:var(--accent)}
details summary{cursor:pointer;font-weight:650;font-size:.95rem;list-style:none}details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾";float:right;color:var(--muted);transition:.2s}details[open] summary::after{transform:rotate(180deg)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;transition:.3s;z-index:9;max-width:90vw}.toast.show{transform:translateX(-50%)}
.sticky{position:sticky;bottom:12px;display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* mobile-first hardening */
.grid>*,.card,.item .meta{min-width:0}
html,body{overflow-x:hidden;max-width:100%}
.wrap{padding:0 max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:5;margin:0 -14px 14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
button,.btn{min-height:44px;min-width:44px;justify-content:center}button.sm{min-height:44px;padding:8px 12px}
input,select{font-size:16px;min-height:44px}input[type=range]{min-height:44px}
input[type=file]{padding:10px;min-height:48px}input[type=file]::file-selector-button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 12px;margin-right:10px;background:var(--accent);color:var(--onaccent)}
.sw{width:52px;height:44px;display:flex;align-items:center}.sw span{inset:9px 0}.sw span::before{top:3px}
.tabs{width:100%}.tabs button{flex:1}
.card{padding:16px}.item audio{flex:1 1 100%;max-width:none}
.prow{grid-template-columns:1fr auto auto}
.opts{grid-template-columns:1fr 1fr}.opts select{grid-column:1/-1}
@media(min-width:600px){.opts{grid-template-columns:1fr 120px auto}.opts select{grid-column:auto}.item audio{flex:0 1 220px}}
.sticky{bottom:calc(12px + env(safe-area-inset-bottom))}.sticky button{box-shadow:var(--shadow)}
.toast{bottom:calc(20px + env(safe-area-inset-bottom))}
.ring{width:130px;height:130px}.ring svg{width:130px;height:130px}
@media(min-width:600px){.ring{width:150px;height:150px}.ring svg{width:150px;height:150px}}

/* library rows: one shared layout for FILE + LINK */
.lib{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"tag meta" "act act";gap:8px 10px;align-items:start;padding:12px;border-radius:12px;background:var(--card2);margin-bottom:8px;border:1px solid transparent;transition:border-color .2s}
.lib:hover{border-color:var(--line)}
.lib>.tag{grid-area:tag;margin-top:2px;min-width:44px;text-align:center}
.lib .meta{grid-area:meta;min-width:0;display:flex;flex-direction:column;gap:2px}
.lib .meta b,.lib .meta .u{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lib .meta b{font-size:.95rem}.lib .meta .u{color:var(--muted);font-size:.8rem}
.lib .w{color:var(--warn);font-size:.8rem}.lib .w.ok{color:var(--accent)}.lib .w:empty{display:none}
.lib .act{grid-area:act;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.lib .act audio{flex:1 1 100%;min-width:0;max-width:100%;height:44px;display:block}
.lib .act .btns{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
@media(max-width:600px){.lib .act .btns{flex:1 1 100%}.lib .act .btns button{flex:1}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><div class="logo">☾</div><div><h1>Adhan</h1><div class="sub" id="loc">…</div></div></div>
<button class="ghost sm" id="theme" onclick="toggleTheme()" aria-label="Toggle theme"></button></div>
<div class="grid">
<section class="card hero span2"><div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" stroke="var(--line)" stroke-width="9" fill="none"/><circle id="arc" cx="75" cy="75" r="66" stroke="var(--accent)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7" style="transition:stroke-dashoffset 1s linear"/></svg><div class="c"><div><div class="cd" id="countdown">--:--:--</div><div class="muted">remaining</div></div></div></div>
<div style="position:relative;z-index:1"><div class="lbl">Next prayer</div><div class="name" id="nextname">—</div><div class="at" id="nextat"></div>
<div class="row" style="margin-top:14px"><button onclick="test()">▶ Test now</button><button class="ghost" onclick="stopAll()">■ Stop</button></div></div></section>

<section class="card"><h2>🕰 Today's prayers <span class="muted" id="src" style="margin-left:auto;font-weight:400"></span></h2><div class="plist" id="plist"></div>
<div class="sticky"><button onclick="saveAll()">Save changes</button></div></section>

<div style="display:flex;flex-direction:column;gap:14px">
<section class="card"><h2>🎵 Adhan library</h2>
<div class="tabs"><button class="on" id="tabU" onclick="tab('U')">Upload MP3</button><button id="tabL" onclick="tab('L')">Add link</button></div>
<div id="paneU"><div class="drop"><input type="file" id="file" accept=".mp3,audio/mpeg,audio/mp3,audio/*"><div class="row" style="justify-content:center;margin-top:8px"><button onclick="upload()">Upload</button></div></div></div>
<div id="paneL" hidden><div class="fg"><label class="f">Name<input id="lname" placeholder="e.g. Makkah Adhan"></label><label class="f">Audio URL (http/https)<input id="lurl" placeholder="https://example.com/adhan.mp3"></label></div>
<div class="row" style="margin-top:10px"><button onclick="addLink()">Add link</button><span class="muted">Speakers stream the URL directly; it must be reachable from them.</span></div></div>
<div style="margin-top:14px" id="library"></div></section>

<section class="card"><h2>🔊 Speakers</h2><div class="row"><button class="ghost" onclick="discover()">🔍 Discover</button><span id="dstat" class="muted"></span></div>
<div id="found" style="margin-top:10px"></div><div class="muted" style="margin:10px 0 6px">Selected</div><div id="selected"></div>
<div class="fg" style="margin-top:8px"><label class="f">Name (optional)<input id="mname"></label><label class="f">Speaker IP<input id="mhost" placeholder="192.168.1.50"></label></div>
<div class="row" style="margin-top:8px"><button class="ghost sm" onclick="addManual()">＋ Add by IP</button></div></section>
</div>

<section class="card"><h2>🎚 Playback</h2><div class="fg"><label class="f">Default adhan<select id="default_media"></select></label>
<label class="f">Global volume <span id="gv"></span><input type="range" min="0" max="1" step="0.05" id="global_volume"></label></div>
<div class="sticky"><button onclick="saveAll()">Save</button></div></section>

<section class="card"><details><summary>⚙️ Location, method &amp; network</summary><div style="margin-top:14px" class="fg">
<label class="f">Location name<input id="location_name"></label><label class="f">Latitude<input id="latitude" inputmode="decimal"></label><label class="f">Longitude<input id="longitude" inputmode="decimal"></label>
<label class="f">Timezone<input id="timezone"></label><label class="f">Method<select id="method"></select></label>
<label class="f">Asr<select id="madhab"><option value="HANAFI">Hanafi (later)</option><option value="SHAFI">Shafi / standard</option></select></label>
<label class="f">Times source<select id="source"><option value="local">Local (offline)</option><option value="aladhan">Aladhan API</option></select></label>
<label class="f">Host LAN IP override<input id="host_ip_override"></label></div>
<div class="muted" id="ipinfo" style="margin-top:10px"></div><div class="sticky"><button onclick="saveAll()">Save settings</button></div></details></section>

<section class="card span2"><h2>📜 Recent activity</h2><div id="log"></div></section>
</div></div><div class="toast" id="toast"></div>
<script>
const P=['fajr','dhuhr','asr','maghrib','isha'];let W={},S={},M=[],T=null,nextAt=null,span=1;
const $=id=>document.getElementById(id),cap=s=>s[0].toUpperCase()+s.slice(1),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3500)}
function setThemeLbl(){$('tc').content=document.documentElement.classList.contains('light')?'#eef3f1':'#0b1110';$('theme').textContent=document.documentElement.classList.contains('light')?'🌙 Dark':'☀️ Light'}
function toggleTheme(){const l=document.documentElement.classList.toggle('light');localStorage.theme=l?'light':'dark';setThemeLbl()}
function tab(x){['U','L'].forEach(k=>{$('tab'+k).classList.toggle('on',k==x);$('pane'+k).hidden=k!=x})}
async function api(u,o={}){const r=await fetch(u,o);if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail}catch(e){}toast('⚠️ '+t);throw t}return r.json()}
const J=b=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const fmt=iso=>new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZone:S.timezone});
function options(sel,blank){const L=S.links||[];return (blank?`<option value="">${blank}</option>`:'')+
 (M.length?`<optgroup label="Uploaded files">${M.map(m=>`<option value="${esc(m.name)}" ${m.name==sel?'selected':''}>📁 ${esc(m.name)}</option>`).join('')}</optgroup>`:'')+
 (L.length?`<optgroup label="Audio links">${L.map(l=>`<option value="link:${l.id}" ${'link:'+l.id==sel?'selected':''}>🔗 ${esc(l.name)}</option>`).join('')}</optgroup>`:'')}
function renderPrayers(){if(!T||!S.prayers)return;const nx=T.next&&T.next.time.slice(0,10)==T.date?T.next.prayer:null;
 $('plist').innerHTML=['fajr','sunrise',...P.slice(1)].map(p=>{if(p=='sunrise')return `<div class="prow sun"><div class="pn muted">☀ Sunrise</div><div class="pt muted">${fmt(T.times.sunrise)}</div></div>`;
 const c=S.prayers[p];return `<div class="prow ${p==nx?'next':''} ${c.enabled?'':'off'}" id="row_${p}"><div class="pn">${cap(p)} ${p==nx?'<span class="tag">Next</span>':''}</div><div class="pt">${fmt(T.times[p])}</div>
 <label class="sw" title="Enable adhan"><input type="checkbox" id="en_${p}" ${c.enabled?'checked':''} onchange="$('row_${p}').classList.toggle('off',!this.checked)"><span></span></label>
 <div class="opts"><select id="md_${p}" aria-label="${p} adhan">${options(c.media,'Default adhan')}</select><input id="vo_${p}" type="number" min="0" max="100" placeholder="Vol %" title="Volume %, blank = global" value="${c.volume==null?'':Math.round(c.volume*100)}"><button class="ghost sm" onclick="test('${p}')">▶ Test</button></div></div>`}).join('')}
async function loadTimes(){T=await api('/api/times');$('loc').textContent=`${T.location} · ${new Date(T.date+'T12:00').toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}`;
 $('src').textContent=`${T.method.replace(/_/g,' ').toLowerCase()} · Asr ${T.madhab.toLowerCase()}`;
 if(T.next){nextAt=Date.now()+T.next.seconds*1000;$('nextname').textContent=cap(T.next.prayer);$('nextat').textContent=fmt(T.next.time)+(T.next.time.slice(0,10)!=T.date?' · tomorrow':'');
  const order=P.map(p=>new Date(T.times[p]).getTime()),nt=new Date(T.next.time).getTime(),prev=order.filter(x=>x<nt).pop()??(new Date(T.times.isha).getTime());span=Math.max(60000,nt-prev)}
 renderPrayers()}
function tick(){if(!nextAt)return;const ms=Math.max(0,nextAt-Date.now()),s=Math.round(ms/1000);if(s==0)setTimeout(loadTimes,3000);
 $('countdown').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');
 $('arc').style.strokeDashoffset=414.7*Math.min(1,ms/span)}
function renderLibrary(){const L=S.links||[];
 const row=(kind,title,sub,src,ref,extra,del)=>`<div class="lib"><span class="tag ${kind=='Link'?'link':''}">${kind}</span><div class="meta"><b title="${esc(title)}">${esc(title)}</b><span class="u" title="${esc(sub)}">${esc(sub)}</span>${extra}</div>
 <div class="act"><audio controls preload="none" src="${esc(src)}"></audio><div class="btns">${kind=='Link'?`<button class="ghost sm" onclick="recheck('${ref.slice(5)}')">Check</button>`:''}<button class="ghost sm" onclick="testMedia('${esc(ref)}')" title="Play on speakers">▶ Test</button><button class="danger sm" onclick="${del}">Delete</button></div></div></div>`;
 $('library').innerHTML=(M.map(m=>row('File',m.name,(m.size/1048576).toFixed(2)+' MB · uploaded',m.url,m.name,'',`delMedia('${esc(m.name)}')`)).join('')+
 L.map(l=>row('Link',l.name,l.url,l.url,'link:'+l.id,`<span class="w" id="w_${l.id}">${esc(W[l.id]||'')}</span>`,`delLink('${l.id}')`)).join(''))||'<div class="muted">No adhan yet — upload an MP3 or add a link.</div>'}
function render(){$('default_media').innerHTML=options(S.default_media,'— none —');$('global_volume').value=S.global_volume;$('gv').textContent=Math.round(S.global_volume*100)+'%';
 ['location_name','latitude','longitude','timezone','madhab','source','host_ip_override'].forEach(k=>$(k).value=S[k]);
 $('method').innerHTML=S.methods.map(m=>`<option value="${m}" ${m==S.method?'selected':''}>${m.replace(/_/g,' ')}${m=='NORTH_AMERICA'?' (ISNA)':''}</option>`).join('');
 $('host_ip_override').placeholder='auto: '+S.detected_ip;$('ipinfo').textContent=`Speakers fetch uploads from http://${S.host_ip_override||S.detected_ip}:${S.port}/media/…`+(S.mock?' · MOCK CAST MODE':'');
 $('selected').innerHTML=S.speakers.map((s,i)=>`<div class="item">🔊<div class="meta"><b>${esc(s.name||s.host)}</b><span class="muted">${esc(s.host||'by name')}</span></div><button class="danger sm" onclick="S.speakers.splice(${i},1);saveAll()">Remove</button></div>`).join('')||'<div class="muted">None selected yet.</div>';
 renderLibrary();renderPrayers()}
async function loadAll(){M=await api('/api/media');S=await api('/api/settings');render()}
function collect(){P.forEach(p=>{if(!$('en_'+p))return;const v=$('vo_'+p).value;S.prayers[p]={enabled:$('en_'+p).checked,media:$('md_'+p).value,volume:v===''?null:Math.min(100,Math.max(0,v))/100}});
 S.default_media=$('default_media').value;S.global_volume=+$('global_volume').value;
 ['location_name','timezone','method','madhab','source','host_ip_override'].forEach(k=>S[k]=$(k).value.trim());S.latitude=+$('latitude').value;S.longitude=+$('longitude').value}
async function saveAll(){collect();const {methods,detected_ip,mock,...body}=S;S=await api('/api/settings',{...J(body),method:'PUT'});render();await loadTimes();loadLog();toast('✓ Saved')}
async function upload(){const f=$('file').files[0];if(!f)return toast('Choose an MP3 first');const fd=new FormData();fd.append('file',f);await api('/api/media',{method:'POST',body:fd});$('file').value='';await loadAll();loadLog();toast('✓ Uploaded '+f.name)}
async function delMedia(n){if(!confirm('Delete '+n+'?'))return;await api('/api/media/'+encodeURIComponent(n),{method:'DELETE'});await loadAll();loadLog()}
async function addLink(){const r=await api('/api/links',J({name:$('lname').value,url:$('lurl').value}));$('lname').value=$('lurl').value='';await loadAll();loadLog();
 W[r.id]=r.warning?'⚠ '+r.warning:'';renderLibrary();if(r.warning){toast('Link saved, but: '+r.warning)}else toast('✓ Link added and reachable')}
async function recheck(id){const l=S.links.find(x=>x.id==id);W[id]='checking…';renderLibrary();const r=await api('/api/links/check',J({url:l.url}));W[id]=r.warning?'⚠ '+r.warning:'✓ reachable';renderLibrary()}
async function delLink(id){if(!confirm('Delete this link?'))return;await api('/api/links/'+id,{method:'DELETE'});await loadAll();loadLog()}
async function discover(){$('dstat').textContent='Searching (~8s)…';try{const d=await api('/api/speakers/discover');$('dstat').textContent=d.length+' found';
 $('found').innerHTML=d.map(s=>`<div class="item">📡<div class="meta"><b>${esc(s.name)}</b><span class="muted">${esc(s.host)} · ${esc(s.model||'')}</span></div><button class="sm" onclick='addSp(${JSON.stringify({name:s.name,host:s.host})})'>Add</button></div>`).join('')}catch(e){$('dstat').textContent='Discovery failed'}}
function addSp(s){collect();if(!S.speakers.some(x=>x.host==s.host&&x.name==s.name))S.speakers.push(s);saveAll()}
function addManual(){const h=$('mhost').value.trim();if(!h)return toast('Enter the speaker IP');addSp({name:$('mname').value.trim(),host:h});$('mhost').value=$('mname').value=''}
async function test(p){const r=await api('/api/test',J(p?{prayer:p}:{}));toast(r.ok?'▶ Sent to speakers':'⚠ Check the activity log');setTimeout(loadLog,1200)}
async function testMedia(m){const r=await api('/api/test',J({media:m}));toast(r.ok?'▶ Sent to speakers':'⚠ Check the activity log');setTimeout(loadLog,1200)}
async function stopAll(){await api('/api/stop',{method:'POST'});toast('■ Stopped')}
async function loadLog(){const l=await api('/api/log');$('log').innerHTML=l.slice(0,60).map(e=>`<div><span class="t">${e.time.slice(5,16).replace('T',' ')}</span><span class="${e.kind}">${esc(e.msg)}</span></div>`).join('')||'<div class="muted">Nothing yet.</div>'}
$('global_volume').oninput=e=>$('gv').textContent=Math.round(e.target.value*100)+'%';setThemeLbl();
(async()=>{await loadAll();await loadTimes();loadLog();setInterval(tick,1000);tick();setInterval(loadLog,15000);setInterval(loadTimes,600000)})();
</script></body></html>
